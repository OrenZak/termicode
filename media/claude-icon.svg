<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Terminal window background -->
  <rect width="24" height="24" rx="5" fill="#1a1a2e"/>
  <!-- Title bar -->
  <rect x="0" y="0" width="24" height="7.5" rx="4" fill="#23233a"/>
  <rect x="0" y="4.5" width="24" height="3" fill="#23233a"/>
  <!-- macOS-style window dots -->
  <circle cx="4.5" cy="3.75" r="1.25" fill="#ff5f57"/>
  <circle cx="8.5" cy="3.75" r="1.25" fill="#febc2e"/>
  <circle cx="12.5" cy="3.75" r="1.25" fill="#27c93f"/>
  <!-- Prompt chevron > -->
  <path d="M4.5 11 L9 14 L4.5 17" stroke="#CC785C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Cursor bar _ -->
  <rect x="10.5" y="16.5" width="8.5" height="2" rx="1" fill="#CC785C"/>
</svg>
